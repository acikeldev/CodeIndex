name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    # windows-latest: the test fixtures use Windows-style paths through Path.GetFullPath,
    # which is OS-dependent; the product itself is cross-platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CodeIndex.slnx

      - name: Build
        run: dotnet build CodeIndex.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CodeIndex.slnx -c Release --no-build
